  <rect class="o box" x="65" y="284" width="184" height="64" rx="8"/><text class="sub ink" x="90" y="311">OPTIONAL SPEAKER</text><text class="small ink" x="103" y="332">CN-21 · left sidepod</text>

  <path class="line" marker-end="url(#arr)" d="M598 370V404"/><path class="line" marker-end="url(#arr)" d="M982 346L850 407"/><path class="line" marker-end="url(#arr)" d="M248 350L365 410"/>
  <polygon class="c box" points="218,427 939,427 1000,484 158,484"/><text class="sub ink" x="460" y="464">LOWER POWER + MECHANICAL LAYER</text>
  <rect class="r box" x="230" y="499" width="195" height="57" rx="8"/><text class="sub ink" x="274" y="524">MOD-PWR battery</text><text class="small ink" x="269" y="544">PS-01 · CN-01 top-out</text>
  <rect class="r box" x="450" y="499" width="180" height="57" rx="8"/><text class="sub ink" x="474" y="524">UBEC shelf / PS-15</text><text class="small ink" x="471" y="544">junction stays · UBECs lift</text>
  <rect class="c box" x="650" y="499" width="136" height="57" rx="8"/><text class="sub ink" x="676" y="524">MOD-STR</text><text class="small ink" x="674" y="544">CN-08 + linkage</text>
  <rect class="p box" x="805" y="499" width="150" height="57" rx="8"/><text class="sub ink" x="840" y="524">MOD-DRV</text><text class="small ink" x="829" y="544">CN-04/22 + bullets</text>
  <rect class="r box" x="120" y="563" width="156" height="52" rx="8"/><text class="sub ink" x="149" y="587">MOD-RX</text><text class="small ink" x="145" y="605">CN-19 · guided ant.</text>
