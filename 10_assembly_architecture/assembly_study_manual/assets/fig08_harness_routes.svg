  <rect class="r box" x="105" y="226" width="125" height="55" rx="7"/><text class="sub ink" x="136" y="252">RX Z2L</text><text class="small ink" x="124" y="271">CN-19 / antenna</text>
  <rect class="r box" x="102" y="490" width="150" height="55" rx="7"/><text class="sub ink" x="126" y="516">PS-15 / PWR</text><text class="small ink" x="118" y="535">CN-01/02/04/05/06</text>
  <rect class="r box" x="280" y="487" width="160" height="55" rx="7"/><text class="sub ink" x="311" y="513">UBEC A/B</text><text class="small ink" x="310" y="532">CN-23A/B</text>
  <rect class="c box" x="515" y="344" width="155" height="70" rx="8"/><text class="sub ink" x="548" y="373">STEERING</text><text class="small ink" x="536" y="396">rod / horn keep-out</text>
  <rect class="p box" x="675" y="466" width="185" height="76" rx="8"/><text class="sub ink" x="719" y="494">MOD-DECK</text><text class="small ink" x="697" y="515">CN-07/CN-16 station</text><text class="small ink" x="714" y="533">U.FL to posts</text>
  <rect class="p box" x="882" y="478" width="120" height="62" rx="7"/><text class="sub ink" x="920" y="505">ESC</text><text class="small ink" x="899" y="524">H-03 → motor</text>
  <rect class="x box" x="1018" y="328" width="93" height="115" rx="7"/><text class="sub ink" x="1036" y="371">REAR</text><text class="sub ink" x="1031" y="392">STACK</text><text class="small ink" x="1027" y="414">H-08 tail</text>

  <path d="M120 305H1030" fill="none" stroke="#227a5c" stroke-width="10" marker-end="url(#arrg)"/><text class="sub ink" x="385" y="292">R1 · Rail A + signal/control</text>
