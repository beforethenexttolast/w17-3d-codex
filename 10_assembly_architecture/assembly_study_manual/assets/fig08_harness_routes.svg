<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
  <title id="t">W17 harness route concept</title><desc id="d">Top-view routing diagram showing left R1 clean and signal highway, right R2 power and servo highway, two crossing stations and rear tail pre-route.</desc>
  <defs><style>.bg{fill:#f7f5f0}.ink{fill:#17222b}.muted{fill:#65717a}.floor{fill:#fff;stroke:#293943;stroke-width:3}.c{fill:#dff3e9;stroke:#227a5c}.r{fill:#dcebf8;stroke:#2f6fad}.p{fill:#fff0cf;stroke:#d98c2b}.x{fill:#fde4df;stroke:#c9564a}.box{stroke-width:2}.h{font:700 25px system-ui}.sub{font:700 16px system-ui}.txt{font:14px system-ui}.small{font:12px system-ui}</style><marker id="arrb" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2f6fad"/></marker><marker id="arrg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#227a5c"/></marker><marker id="arro" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#d98c2b"/></marker></defs>
  <rect class="bg" width="1200" height="760"/><text class="h ink" x="48" y="45">Harness routing — two edge highways, two controlled crossings</text><text class="txt muted" x="48" y="70">FRONT left · open centre · corridors only, lengths remain provisional</text>
