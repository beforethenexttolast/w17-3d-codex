  <path d="M715 565V305" fill="none" stroke="#7456a3" stroke-width="7" stroke-dasharray="9 6"/><text class="sub ink" x="698" y="335">X1</text><text class="small ink" x="730" y="359">steer + tail</text><text class="small ink" x="730" y="376">below rod</text>
  <path d="M1010 305H1080V328" fill="none" stroke="#2f6fad" stroke-width="8" marker-end="url(#arrb)"/><text class="small ink" x="915" y="286">H-08 pre-route before closure</text>
