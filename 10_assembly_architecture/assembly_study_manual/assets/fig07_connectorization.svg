<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="t d">
  <title id="t">W17 connectorization concept</title><desc id="d">Module-boundary block diagram showing power junction, drive, deck, receiver, camera, body and rear-tail connectors.</desc>
  <defs><style>.bg{fill:#f7f5f0}.ink{fill:#17222b}.muted{fill:#65717a}.c{fill:#dff3e9;stroke:#227a5c}.r{fill:#dcebf8;stroke:#2f6fad}.p{fill:#fff0cf;stroke:#d98c2b}.x{fill:#fde4df;stroke:#c9564a}.o{fill:#eee6f8;stroke:#7456a3}.box{stroke-width:2}.wire{fill:none;stroke:#293943;stroke-width:3}.power{stroke:#c9564a}.a{stroke:#2f6fad}.b{stroke:#d98c2b}.sig{stroke:#227a5c;stroke-dasharray:7 5}.h{font:700 25px system-ui}.sub{font:700 16px system-ui}.txt{font:14px system-ui}.small{font:12px system-ui}</style><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#293943"/></marker></defs>
  <rect class="bg" width="1200" height="820"/><text class="h ink" x="48" y="45">Connectorization — modules first, connectors at boundaries</text><text class="txt muted" x="48" y="70">Families, gauges, ratings, and lengths remain provisional until D-24 / D-10 / Gate P9.</text>
  <rect class="r box" x="55" y="120" width="180" height="72" rx="10"/><text class="sub ink" x="103" y="149">PWR-BAT</text><text class="small ink" x="88" y="173">source side shrouded</text>
  <rect class="c box" x="375" y="105" width="300" height="105" rx="12"/><text class="sub ink" x="455" y="135">MOD-PWR / PS-15</text><text class="small ink" x="414" y="160">star ground · branch seats · test loops</text><text class="small ink" x="409" y="184">CN-02 loop-key recommended / owner call</text>
  <line class="wire power" x1="235" y1="156" x2="375" y2="156"/><text class="sub ink" x="277" y="145">CN-01</text>
  <rect class="p box" x="835" y="104" width="250" height="90" rx="10"/><text class="sub ink" x="918" y="134">MOD-DRV</text><text class="small ink" x="867" y="159">ESC + motor · BEC red lifted</text><text class="small ink" x="894" y="179">CN-04 power / CN-22 sig</text><line class="wire power" x1="675" y1="137" x2="835" y2="137"/><line class="wire sig" x1="835" y1="177" x2="675" y2="177"/>

  <rect class="r box" x="270" y="290" width="170" height="86" rx="10"/><text class="sub ink" x="310" y="318">UBEC-A</text><text class="small ink" x="294" y="342">Rail A clean 5 V</text><text class="small ink" x="294" y="361">CN-05 / CN-23A</text>
  <rect class="r box" x="610" y="290" width="170" height="86" rx="10"/><text class="sub ink" x="652" y="318">UBEC-B</text><text class="small ink" x="632" y="342">Rail B servo 5–6 V</text><text class="small ink" x="634" y="361">CN-06 / CN-23B</text>
  <path class="wire power" d="M450 210V247H355V290"/><path class="wire power" d="M600 210V247H695V290"/>

  <rect class="p box" x="420" y="470" width="340" height="115" rx="12"/><text class="sub ink" x="520" y="500">MOD-DECK</text><text class="small ink" x="462" y="525">CTL-E1/E2 · AMP · Wi-Fi · internal solder</text><text class="small ink" x="476" y="548">CN-07 ganged harness bank + CN-16 USB</text><text class="small ink" x="508" y="570">U.FL CN-17/18 guided</text>
  <path class="wire a" d="M355 376V425H510V470"/><path class="wire b" d="M695 376V425H670V470"/><text class="small ink" x="405" y="414">split power pins if required</text>

  <rect class="r box" x="55" y="465" width="190" height="75" rx="10"/><text class="sub ink" x="105" y="494">MOD-RX</text><text class="small ink" x="85" y="518">CN-19 CRSF + ground</text><path class="wire sig" d="M245 503H420"/>
  <rect class="x box" x="55" y="625" width="250" height="106" rx="10"/><text class="sub ink" x="104" y="655">MOD-CAM / GIMBAL</text><text class="small ink" x="83" y="680">CN-09/10 servo · CN-12 blower</text><text class="small ink" x="82" y="701">CN-24 power · CN-16 USB boundary</text><text class="small ink" x="115" y="720">board solder stays inside</text><path class="wire a" d="M305 671H375V555H420"/><path class="wire sig" d="M305 705H390V570H420"/>
  <rect class="r box" x="900" y="455" width="230" height="92" rx="10"/><text class="sub ink" x="975" y="485">MOD-BODY</text><text class="small ink" x="938" y="510">one CN-14 · halo LED + spare</text><text class="small ink" x="955" y="530">80 mm shell service loop</text><path class="wire a" d="M760 512H900"/>
  <rect class="o box" x="880" y="630" width="250" height="106" rx="10"/><text class="sub ink" x="945" y="660">MOD-RLD</text><text class="small ink" x="914" y="684">CN-11 DRS · CN-13 brake LED</text><text class="small ink" x="921" y="706">CN-15 Hall · pull-through tail</text><path class="wire sig" d="M760 553H825V682H880"/>
  <rect class="r box" x="480" y="655" width="220" height="76" rx="10"/><text class="sub ink" x="537" y="684">MOD-STR</text><text class="small ink" x="518" y="709">CN-08 · re-centre after service</text><path class="wire b" d="M695 376V630H590V655"/>

  <rect class="c box" x="80" y="770" width="1040" height="32" rx="7"/><text class="txt ink" x="124" y="792">Rules: live side female/shrouded · keyed/retained · no unsecured Dupont · no arbitrary mid-run mates · antennas before Rail A power</text>
</svg>
