<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
  <title id="t">Internal architecture option comparison</title><desc id="d">Four panels compare single-level distributed, narrow two-level deck, full-width bridge and open skeleton construction.</desc>
  <defs><style>.bg{fill:#f7f5f0}.ink{fill:#17222b}.muted{fill:#65717a}.c{fill:#dff3e9;stroke:#227a5c}.r{fill:#dcebf8;stroke:#2f6fad}.p{fill:#fff0cf;stroke:#d98c2b}.x{fill:#fde4df;stroke:#c9564a}.box{stroke-width:2}.panel{fill:#fff;stroke:#aab2b8;stroke-width:2}.floor{fill:#d9dee1;stroke:#65717a;stroke-width:2}.line{stroke:#293943;stroke-width:2}.dash{stroke-dasharray:7 6}.h{font:700 25px system-ui}.sub{font:700 17px system-ui}.txt{font:14px system-ui}.small{font:12px system-ui}</style></defs>
  <rect class="bg" width="1200" height="760"/><text class="h ink" x="48" y="45">Structure trade study — what should carry the internals?</text><text class="txt muted" x="48" y="70">The recommended solution combines a narrow conditional deck with an open skeleton; fallback A stays live.</text>
  <g transform="translate(40 105)"><rect class="panel" width="265" height="555" rx="12"/><text class="sub ink" x="35" y="35">A · SINGLE LEVEL</text><text class="sub ink" x="62" y="58">DISTRIBUTED</text><rect class="floor" x="25" y="290" width="215" height="20"/><rect class="r box" x="35" y="240" width="72" height="50" rx="5"/><rect class="r box" x="115" y="258" width="52" height="32" rx="5"/><rect class="p box" x="176" y="224" width="53" height="66" rx="5"/><path class="x box" d="M90 178H190V220H90Z" stroke-dasharray="7 6"/><text class="small ink" x="100" y="203">open rod</text><text class="txt ink" x="27" y="346">+ lowest CG / easiest roof</text><text class="txt ink" x="27" y="371">+ simple physical evidence</text><text class="txt ink" x="27" y="396">− floor + connector congestion</text><text class="txt ink" x="27" y="421">− boards removed individually</text><rect class="r box" x="25" y="476" width="215" height="49" rx="8"/><text class="sub ink" x="53" y="497">RECOMMENDED</text><text class="small ink" x="70" y="516">FALLBACK A</text></g>
  <g transform="translate(325 105)"><rect class="panel" width="265" height="555" rx="12"/><text class="sub ink" x="35" y="35">B · NARROW DECK</text><text class="sub ink" x="54" y="58">TWO LEVEL</text><rect class="floor" x="25" y="290" width="215" height="20"/><rect class="r box" x="35" y="240" width="75" height="50" rx="5"/><rect class="r box" x="150" y="258" width="72" height="32" rx="5"/><rect class="p box" x="128" y="180" width="106" height="16" rx="4"/><line class="line" x1="145" y1="196" x2="145" y2="290"/><line class="line" x1="218" y1="196" x2="218" y2="290"/><rect class="p box" x="142" y="145" width="33" height="35"/><rect class="p box" x="180" y="150" width="43" height="30"/><path class="x box" d="M82 205H132V250H82Z" stroke-dasharray="7 6"/><text class="txt ink" x="27" y="346">+ one-piece controller service</text><text class="txt ink" x="27" y="371">+ clean CN-07 termination</text><text class="txt ink" x="27" y="396">− S0 / roof / USB critical</text><text class="txt ink" x="27" y="421">− high right-side mass</text><rect class="p box" x="25" y="476" width="215" height="49" rx="8"/><text class="sub ink" x="49" y="497">RECOMMENDED</text><text class="small ink" x="56" y="516">ONLY IF S0 + P1 PASS</text></g>
  <g transform="translate(610 105)"><rect class="panel" width="265" height="555" rx="12"/><text class="sub ink" x="32" y="35">C · FULL-WIDTH</text><text class="sub ink" x="73" y="58">BRIDGE</text><rect class="floor" x="25" y="290" width="215" height="20"/><rect class="x box" x="35" y="175" width="195" height="20"/><line class="line" x1="50" y1="195" x2="50" y2="290"/><line class="line" x1="215" y1="195" x2="215" y2="290"/><rect class="r box" x="40" y="240" width="70" height="50"/><path class="x box" d="M80 190H190V255H80Z" stroke-dasharray="7 6"/><path d="M65 158L205 270M205 158L65 270" stroke="#c9564a" stroke-width="7"/><text class="txt ink" x="27" y="346">− crosses steering corridor</text><text class="txt ink" x="27" y="371">− buries battery / fasteners</text><text class="txt ink" x="27" y="396">− blocks airflow + shell path</text><text class="txt ink" x="27" y="421">− solves no stiffness problem</text><rect class="x box" x="25" y="476" width="215" height="49" rx="8"/><text class="sub ink" x="81" y="506">BLOCKED</text></g>
  <g transform="translate(895 105)"><rect class="panel" width="265" height="555" rx="12"/><text class="sub ink" x="43" y="35">D · OPEN</text><text class="sub ink" x="48" y="58">SKELETON</text><rect class="floor" x="25" y="290" width="215" height="20"/><rect class="r box" x="35" y="240" width="70" height="50" rx="5"/><rect class="r box" x="145" y="255" width="70" height="35" rx="5"/><line class="line" x1="137" y1="210" x2="137" y2="290"/><line class="line" x1="225" y1="230" x2="225" y2="290"/><rect class="p box" x="125" y="194" width="110" height="16" rx="4"/><path class="x box" d="M82 194H120V250H82Z" stroke-dasharray="7 6"/><text class="small ink" x="55" y="328">tray · shelf · posts · clips</text><text class="txt ink" x="27" y="346">+ structure only where needed</text><text class="txt ink" x="27" y="371">+ airflow + access preserved</text><text class="txt ink" x="27" y="396">+ cheap local iteration</text><text class="txt ink" x="27" y="421">− more small interfaces</text><rect class="c box" x="25" y="476" width="215" height="49" rx="8"/><text class="sub ink" x="48" y="497">RECOMMENDED</text><text class="small ink" x="63" y="516">CONSTRUCTION METHOD</text></g>
  <rect class="c box" x="247" y="694" width="706" height="38" rx="8"/><text class="sub ink" x="302" y="719">CURRENT DIRECTION: B + D, with A retained as the evidence-triggered fallback</text>
</svg>
