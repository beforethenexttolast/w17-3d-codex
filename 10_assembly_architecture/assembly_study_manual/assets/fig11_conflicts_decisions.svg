<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="t d">
  <title id="t">W17 conflict and decision map</title><desc id="d">Decision tree centered on physical shell seat S0 with branches for narrow deck and fallback A plus other blocked or gated decisions.</desc>
  <defs><style>.bg{fill:#f7f5f0}.ink{fill:#17222b}.muted{fill:#65717a}.c{fill:#dff3e9;stroke:#227a5c}.r{fill:#dcebf8;stroke:#2f6fad}.p{fill:#fff0cf;stroke:#d98c2b}.x{fill:#fde4df;stroke:#c9564a}.o{fill:#eee6f8;stroke:#7456a3}.box{stroke-width:2}.wire{fill:none;stroke:#293943;stroke-width:3}.dash{stroke-dasharray:8 6}.h{font:700 25px system-ui}.sub{font:700 15px system-ui}.txt{font:14px system-ui}.small{font:12px system-ui}</style><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#293943"/></marker></defs>
  <rect class="bg" width="1200" height="820"/><text class="h ink" x="48" y="45">Conflict and decision atlas — what evidence changes the build?</text><text class="small muted" x="48" y="70">A branch is not a decision until its named observation exists and the decision register is updated.</text>
  <rect class="x box" x="405" y="105" width="390" height="82" rx="12"/><text class="sub ink" x="488" y="133">HIGHEST-VALUE PHYSICAL INPUT</text><text class="txt ink" x="444" y="158">Seat body on real landing points → measure S0 at ≥4 points</text><text class="small ink" x="480" y="177">also record non-planarity, screw heads and D-27 occupancy</text>
  <path class="wire" d="M600 187V240H280V278M600 240H920V278"/>
  <rect class="p box" x="85" y="278" width="390" height="100" rx="11"/><text class="sub ink" x="137" y="307">S0 ABOUT ≥6 mm + COMPLETE H20 CLUSTER PASSES</text><text class="small ink" x="120" y="333">shell ≥5 mm · physical D-26 ≥8 mm · USB/CN hand room</text><text class="small ink" x="125" y="355">loaded deck installs/removes · lower layer remains serviceable</text>
  <rect class="r box" x="117" y="408" width="326" height="75" rx="10"/><text class="sub ink" x="167" y="437">CONTINUE NARROW-DECK REVIEW</text><text class="small ink" x="158" y="461">evidence for CAD-05 decision — not authorization</text>
  <path class="wire" marker-end="url(#arr)" d="M280 378V408"/>

  <rect class="x box" x="725" y="278" width="390" height="100" rx="11"/><text class="sub ink" x="781" y="307">S0 / CLEARANCE / SERVICE CLUSTER FAILS</text><text class="small ink" x="762" y="333">record exact clash and gap · retain photos · do not trim into pass</text><text class="small ink" x="792" y="355">airbox ESP32 fallback remains geometrically dead</text>
  <rect class="r box" x="757" y="408" width="326" height="75" rx="10"/><text class="sub ink" x="816" y="437">RETURN TO FALLBACK A REVIEW</text><text class="small ink" x="803" y="461">distributed single-level modules · no automatic freeze</text>
  <path class="wire" marker-end="url(#arr)" d="M920 378V408"/>

  <rect class="x box" x="55" y="555" width="205" height="120" rx="10"/><text class="sub ink" x="89" y="584">D-06 / GATE C</text><text class="small ink" x="75" y="610">camera calipers · cable exit</text><text class="small ink" x="75" y="630">gimbal sweep · blower/duct</text><text class="small ink" x="75" y="650">cockpit vs halo owner call</text><text class="small ink" x="83" y="668">NO nose protected volume</text>
  <rect class="x box" x="280" y="555" width="205" height="120" rx="10"/><text class="sub ink" x="315" y="584">ASM-08 / D-26</text><text class="small ink" x="299" y="610">centre servo then lock-to-lock</text><text class="small ink" x="299" y="630">rod/joint Z + lateral sweep</text><text class="small ink" x="299" y="650">battery · X1 · deck boundary</text><text class="small ink" x="318" y="668">8 mm moving policy</text>
  <rect class="p box" x="505" y="555" width="205" height="120" rx="10"/><text class="sub ink" x="555" y="584">D-24 POWER</text><text class="small ink" x="526" y="610">real Wi-Fi · rail peaks</text><text class="small ink" x="526" y="630">UBEC upsize / LED cap</text><text class="small ink" x="526" y="650">fuse / wire / CN ratings</text><text class="small ink" x="543" y="668">harness final only later</text>
  <rect class="o box" x="730" y="555" width="205" height="120" rx="10"/><text class="sub ink" x="777" y="584">D-03 / DN-07</text><text class="small ink" x="750" y="610">real speaker + carrier</text><text class="small ink" x="750" y="630">left port / audibility</text><text class="small ink" x="750" y="650">balance contribution</text><text class="small ink" x="770" y="668">optional installation</text>
  <rect class="x box" x="955" y="555" width="205" height="120" rx="10"/><text class="sub ink" x="999" y="584">GATE A / REAR</text><text class="small ink" x="975" y="610">68 mm shock articulation</text><text class="small ink" x="975" y="630">stack/channel selection</text><text class="small ink" x="975" y="650">PS-09 / PS-16 geometry</text><text class="small ink" x="994" y="668">physical closure first</text>

  <path class="wire dash" d="M157 555V520H1058V555"/><path class="wire dash" d="M382 555V520M607 555V520M832 555V520"/>
  <rect class="c box" x="165" y="731" width="870" height="48" rx="8"/><text class="sub ink" x="215" y="754">DECISION DISCIPLINE: update the authority register with measured evidence; revise only the affected parameter/module</text><text class="small ink" x="353" y="772">no silent shims · no guessed camera block · no production claim from a diagnostic pass</text>
</svg>
