<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
  <title id="t">W17 transverse internal section</title><desc id="d">Transverse schematic comparing battery side and belt side, with central steering keep-out, low UBEC shelf, conditional narrow deck and edge harness corridors.</desc>
  <defs><style>.bg{fill:#f7f5f0}.ink{fill:#17222b}.muted{fill:#65717a}.c{fill:#dff3e9;stroke:#227a5c}.r{fill:#dcebf8;stroke:#2f6fad}.p{fill:#fff0cf;stroke:#d98c2b}.x{fill:#fde4df;stroke:#c9564a}.box{stroke-width:2}.line{fill:none;stroke:#293943;stroke-width:3}.dash{stroke-dasharray:9 7}.h{font:700 25px system-ui}.sub{font:700 16px system-ui}.txt{font:14px system-ui}.small{font:12px system-ui}</style></defs>
  <rect class="bg" width="1200" height="720"/><text class="h ink" x="48" y="45">Transverse section — left/right stack and open spine</text><text class="txt muted" x="48" y="70">Representative junction/core station · not a shell-measurement drawing</text>
