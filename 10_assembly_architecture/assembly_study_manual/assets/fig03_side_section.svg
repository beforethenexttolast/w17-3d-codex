<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
  <title id="t">W17 longitudinal side section</title><desc id="d">Longitudinal schematic showing shell, DAT-F, S0, lower modules, conditional deck, steering rod band and rear drivetrain.</desc>
  <defs><style>.bg{fill:#f7f5f0}.ink{fill:#17222b}.muted{fill:#65717a}.c{fill:#dff3e9;stroke:#227a5c}.r{fill:#dcebf8;stroke:#2f6fad}.p{fill:#fff0cf;stroke:#d98c2b}.x{fill:#fde4df;stroke:#c9564a}.box{stroke-width:2}.line{fill:none;stroke:#293943;stroke-width:3}.dash{stroke-dasharray:9 7}.h{font:700 25px system-ui}.sub{font:700 16px system-ui}.txt{font:14px system-ui}.small{font:12px system-ui}</style><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#293943"/></marker></defs>
  <rect class="bg" width="1200" height="720"/><text class="h ink" x="48" y="45">Longitudinal section — height logic</text><text class="txt muted" x="48" y="70">FRONT left · Z dimensions above DAT-F · shell profile schematic</text>
