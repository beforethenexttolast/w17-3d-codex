  <rect class="p box" x="645" y="302" width="72" height="42" rx="5"/><text class="small ink" x="656" y="326">E1/E2</text><rect class="p box" x="728" y="314" width="62" height="30" rx="5"/><text class="small ink" x="742" y="334">AMP</text><rect class="p box" x="800" y="295" width="82" height="49" rx="5"/><text class="small ink" x="816" y="318">Wi-Fi</text><text class="small ink" x="807" y="335">provisional</text>
