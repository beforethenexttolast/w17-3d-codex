  <line x1="80" y1="455" x2="1130" y2="455" stroke="#227a5c" stroke-width="3"/><line x1="80" y1="397" x2="1130" y2="397" stroke="#d98c2b" stroke-width="3" stroke-dasharray="8 6"/><text class="small ink" x="90" y="390">DAT-S = DAT-F + S0 (S0 physically unresolved 0…~11)</text>

  <rect class="r box" x="390" y="393" width="230" height="62" rx="7"/><text class="sub ink" x="453" y="421">BATTERY</text><text class="small ink" x="421" y="441">body top ≈Z28 incl. low tray</text>
  <rect class="r box" x="625" y="425" width="155" height="30" rx="6"/><text class="sub ink" x="646" y="446">UBEC shelf ≤Z14</text>
