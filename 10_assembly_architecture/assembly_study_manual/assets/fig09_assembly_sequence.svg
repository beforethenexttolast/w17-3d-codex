<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="t d">
  <title id="t">W17 approximate assembly sequence</title><desc id="d">Ten-step dependency-aware assembly sequence with evidence gates before upper layer, shell closure and final harness.</desc>
  <defs><style>.bg{fill:#f7f5f0}.ink{fill:#17222b}.muted{fill:#65717a}.c{fill:#dff3e9;stroke:#227a5c}.r{fill:#dcebf8;stroke:#2f6fad}.p{fill:#fff0cf;stroke:#d98c2b}.x{fill:#fde4df;stroke:#c9564a}.box{stroke-width:2}.wire{fill:none;stroke:#293943;stroke-width:3}.h{font:700 25px system-ui}.num{font:700 24px system-ui}.sub{font:700 15px system-ui}.small{font:12px system-ui}</style><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#293943"/></marker></defs>
  <rect class="bg" width="1200" height="820"/><text class="h ink" x="48" y="45">Assembly study sequence — test before burial</text><text class="small muted" x="48" y="70">Summary only; detailed authority is ASM-01…48 and Gates P0…P10.</text>
  <path class="wire" marker-end="url(#arr)" d="M220 160H330M470 160H580M720 160H830M970 160V285M970 405H830M690 405H580M440 405H330M190 405V540M190 660H330M470 660H580M720 660H830"/>

  <g transform="translate(65 110)"><rect class="r box" width="155" height="100" rx="10"/><text class="num ink" x="15" y="33">1</text><text class="sub ink" x="48" y="31">VERIFY</text><text class="small ink" x="18" y="56">inventory · D-06 · Wi-Fi</text><text class="small ink" x="18" y="75">print IDs / inserts</text><text class="small ink" x="18" y="92">no TP in final build</text></g>
  <g transform="translate(330 110)"><rect class="c box" width="140" height="100" rx="10"/><text class="num ink" x="15" y="33">2</text><text class="sub ink" x="47" y="31">DAT-F</text><text class="small ink" x="17" y="56">assemble floor</text><text class="small ink" x="17" y="75">S0 · screws · landing</text><text class="small ink" x="17" y="92">occupancy map</text></g>
  <g transform="translate(580 110)"><rect class="r box" width="140" height="100" rx="10"/><text class="num ink" x="15" y="33">3</text><text class="sub ink" x="47" y="31">STEER</text><text class="small ink" x="17" y="56">servo first · centre</text><text class="small ink" x="17" y="75">close linkage</text><text class="small ink" x="17" y="92">measure D-26</text></g>
  <g transform="translate(830 110)"><rect class="r box" width="140" height="100" rx="10"/><text class="num ink" x="15" y="33">4</text><text class="sub ink" x="47" y="31">MECH</text><text class="small ink" x="17" y="56">suspension · Gate A</text><text class="small ink" x="17" y="75">shock · drivetrain</text><text class="small ink" x="17" y="92">motor / belt</text></g>
  <g transform="translate(830 305)"><rect class="p box" width="140" height="100" rx="10"/><text class="num ink" x="15" y="33">5</text><text class="sub ink" x="47" y="31">TAIL FIRST</text><text class="small ink" x="17" y="56">pre-route H-08</text><text class="small ink" x="17" y="75">LED · Hall · DRS</text><text class="small ink" x="17" y="92">before rear closure</text></g>
  <g transform="translate(580 305)"><rect class="r box" width="140" height="100" rx="10"/><text class="num ink" x="15" y="33">6</text><text class="sub ink" x="47" y="31">LOWER</text><text class="small ink" x="17" y="56">tray · ESC · UBEC</text><text class="small ink" x="17" y="75">junction · long looms</text><text class="small ink" x="17" y="92">bench test before deck</text></g>
  <g transform="translate(330 305)"><rect class="x box" width="140" height="100" rx="10"/><text class="num ink" x="15" y="33">7</text><text class="sub ink" x="47" y="31">DECIDE</text><text class="small ink" x="17" y="56">H20 full cluster</text><text class="small ink" x="17" y="75">narrow deck passes?</text><text class="small ink" x="17" y="92">else fallback A</text></g>
  <g transform="translate(50 305)"><rect class="p box" width="140" height="100" rx="10"/><text class="num ink" x="15" y="33">8</text><text class="sub ink" x="47" y="31">PERIPHERY</text><text class="small ink" x="17" y="56">RX · sensor · Wi-Fi</text><text class="small ink" x="17" y="75">camera if unblocked</text><text class="small ink" x="17" y="92">LED / optional items</text></g>
  <g transform="translate(50 560)"><rect class="r box" width="140" height="100" rx="10"/><text class="num ink" x="15" y="33">9</text><text class="sub ink" x="47" y="31">PRE-CLOSE</text><text class="small ink" x="17" y="56">exercise every system</text><text class="small ink" x="17" y="75">dress / sweep loom</text><text class="small ink" x="17" y="92">trial shell + CN-14</text></g>
  <g transform="translate(330 560)"><rect class="x box" width="390" height="100" rx="10"/><text class="num ink" x="15" y="33">10</text><text class="sub ink" x="58" y="31">VALIDATE BEFORE FINAL HARNESS</text><text class="small ink" x="22" y="56">polarity → limited power → D-24 rail current → motion → video/RF</text><text class="small ink" x="22" y="75">thermal → balance → service drills → only then cut/label harness</text><text class="small ink" x="22" y="93">P10 production authorization remains later and per-part</text></g>
  <g transform="translate(830 560)"><rect class="c box" width="290" height="100" rx="10"/><text class="sub ink" x="32" y="30">PASS CONDITION</text><text class="small ink" x="25" y="54">every buried subsystem tested;</text><text class="small ink" x="25" y="73">motion and body clear; module-out timed;</text><text class="small ink" x="25" y="92">unknowns remain labelled, not guessed.</text></g>
  <rect class="x box" x="230" y="713" width="740" height="48" rx="8"/><text class="sub ink" x="276" y="742">STOP at any failed gate. Remove the upper module and fix with access; do not route around an unrecorded clash.</text>
</svg>
