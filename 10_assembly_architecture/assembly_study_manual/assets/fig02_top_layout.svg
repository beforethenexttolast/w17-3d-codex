  <text class="sub ink" x="410" y="118">ARCHITECTURE LEFT · L&gt;0 · battery / clean-RF side</text><text class="sub ink" x="405" y="655">ARCHITECTURE RIGHT · L&lt;0 · belt / power / deck side</text>

  <rect class="r box" x="430" y="270" width="225" height="78" rx="10"/><text class="sub ink" x="475" y="300">PWR-BAT + PS-01</text><text class="txt ink" x="464" y="322">75×45×25 max · bay length 78</text><text class="small ink" x="498" y="340">RECOMMENDED floor-left</text>
  <rect class="r box" x="227" y="282" width="116" height="55" rx="8"/><text class="sub ink" x="247" y="307">RX-ELRS</text><text class="small ink" x="241" y="326">RF-quiet Z2L</text>
  <path d="M230 287L155 236" stroke="#2f6fad" stroke-width="5" marker-end="url(#arr)"/><text class="small ink" x="112" y="222">antenna fwd</text>
  <rect class="o box" x="670" y="270" width="150" height="58" rx="9"/><text class="sub ink" x="690" y="296">SPEAKER?</text><text class="small ink" x="684" y="316">left sidepod · DN-07</text>

  <rect class="c box" x="535" y="352" width="170" height="58" rx="10"/><text class="sub ink" x="562" y="377">SRV-STEER</text><text class="small ink" x="551" y="397">KO-19 donor occupant</text>
  <path class="box" fill="none" stroke="#c9564a" d="M280 338 H830 V418 H280 Z" stroke-dasharray="9 7"/><text class="small ink" x="298" y="360">KO-01 reserved high rod/joint band Z35…62</text>
