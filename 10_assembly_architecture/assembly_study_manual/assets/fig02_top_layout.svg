  <rect class="r box" x="215" y="431" width="138" height="58" rx="8"/><text class="sub ink" x="235" y="456">PS-15 BANK</text><text class="small ink" x="231" y="476">Z2R · low open frame</text>
  <rect class="r box" x="427" y="432" width="190" height="58" rx="8"/><text class="sub ink" x="457" y="456">UBEC A / B · PS-03</text><text class="small ink" x="467" y="476">≤Z14 · separate rails</text>
