<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
  <title id="t">Approximate W17 internal top layout</title><desc id="d">Top-view schematic with front left, battery on architecture-left, power and electronics on belt-side architecture-right, central keep-outs, routes, and optional modules.</desc>
  <defs><style>.bg{fill:#f7f5f0}.ink{fill:#17222b}.muted{fill:#65717a}.outline{fill:#fff;stroke:#293943;stroke-width:3}.floor{fill:#e9ecee;stroke:#65717a;stroke-width:2}.c{fill:#dff3e9;stroke:#227a5c}.r{fill:#dcebf8;stroke:#2f6fad}.p{fill:#fff0cf;stroke:#d98c2b}.x{fill:#fde4df;stroke:#c9564a}.o{fill:#eee6f8;stroke:#7456a3}.box{stroke-width:2}.dash{stroke-dasharray:8 7}.h{font:700 25px system-ui}.sub{font:700 16px system-ui}.txt{font:14px system-ui}.small{font:12px system-ui}</style><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#293943"/></marker></defs>
  <rect class="bg" width="1200" height="760"/><text class="h ink" x="48" y="45">Approximate internal layout — top view, body removed</text><text class="txt muted" x="48" y="70">FRONT at left · view from above · architecture RIGHT / belt side = L&lt;0</text>
